ons such as advertising, personal selling, sales promotion and publicity."], ["Channel strategy vs. logistics management?", "Channel strategy manages the wider channel organization and relationships; logistics focuses on physical product flow and availability."], ["Define channel structure.", "The group of channel members to which a set of distribution tasks has been allocated."], ["Define ancillary structure.", "The group of facilitating agencies that assist channel members in performing distribution tasks."]], "questions": [{"q": "Which factor is identified in the slides as increasing the importance of marketing channels?", "opts": ["Less use of technology", "Growing power of distributors, especially retailers", "Elimination of distribution costs", "Declining e-commerce"], "a": 1, "why": "The slides list distributor/retailer power among the four drivers."}, {"q": "Disintermediation refers to:", "opts": ["Adding more retailers", "Reducing the number of intermediaries", "Transferring product ownership", "Increasing inventory"], "a": 1, "why": "Disintermediation is defined as a reduction in the number of intermediaries."}, {"q": "Which is a negotiatory function?", "opts": ["Transporting goods only", "Advertising design only", "Buying and selling", "Providing insurance only"], "a": 2, "why": "The slides identify buying, selling and transfer of title as negotiatory functions."}, {"q": "Which channel flow concerns the physical movement of products?", "opts": ["Promotion flow", "Product flow", "Ownership flow", "Negotiation flow"], "a": 1, "why": "Product flow follows the physical movement of products through the channel."}, {"q": "Which flow tracks the movement of title to a product?", "opts": ["Ownership flow", "Information flow", "Product flow", "Promotion flow"], "a": 0, "why": "Ownership flow represents the movement of title/ownership."}, {"q": "Which statement best distinguishes channel strategy from logistics management?", "opts": ["They mean exactly the same thing", "Logistics is broader than channel strategy", "Channel strategy is broader; logistics focuses on physical product flow", "Channel strategy only means advertising"], "a": 2, "why": "The slides describe channel strategy as the broader task and logistics as focused on physical flow."}, {"q": "Information flow in marketing channels is described as:", "opts": ["Only from manufacturer to consumer", "Only between retailers", "Two-directional among channel participants", "Unnecessary for distribution"], "a": 2, "why": "The slides say all parties participate and information flow is up and down the channel."}, {"q": "Which is an example of an ancillary-structure participant?", "opts": ["A retailer taking title and reselling", "A wholesaler buying and reselling", "A transportation company providing transport", "A consumer buying for personal use"], "a": 2, "why": "Transportation companies are facilitating agencies that support channel members."}, {"q": "True or false: Channel strategy should support the other marketing-mix variables.", "opts": ["True", "False"], "a": 0, "why": "The slides state channels should support and enhance product, pricing and promotion strategies."}, {"q": "True or false: A transportation company is necessarily a channel member because it moves products.", "opts": ["True", "False"], "a": 1, "why": "The slides distinguish facilitating agencies from channel members performing negotiatory functions."}]}, {"id": 2, "title": "The Channel Participants", "subtitle": "Members, intermediaries, retailers and facilitating agencies", "objectives": ["Classify channel participants by negotiatory functions.", "Explain why manufacturers shift distribution tasks to intermediaries.", "Identify major types of wholesalers.", "Describe distribution tasks performed for manufacturers and customers.", "Explain retail structure and trends.", "Identify common facilitating agencies."], "summary": [["Channel participant classification", "The slides classify participants by whether they perform negotiatory functions. Firms that buy, sell or transfer title are member participants; firms performing other support functions are nonmember participants/facilitating agencies."], ["Why use intermediaries?", "Manufacturers may lack distribution expertise and economies of scale in distribution. Intermediaries can spread fixed costs across large quantities and diverse products, achieving economies of scale and scope."], ["Merchant wholesalers", "They buy products, take title, usually hold inventory and physically handle products in large quantities, then resell in smaller quantities to retailers and business customers."], ["Agents, brokers and commission merchants", "These independent middlemen negotiate on behalf of clients but do not take title. They are usually compensated through commissions. Commission merchants typically take physical possession of goods without taking title."], ["Manufacturers' sales branches and offices", "These are owned and operated by manufacturers, physically separate from manufacturing plants, and distribute the manufacturer's products at wholesale."], ["Wholesaler tasks for manufacturers", "The slides list market coverage, sales contacts, inventory holding, order processing, market information and customer support."], ["Wholesaler tasks for customers", "Tasks include product availability, customer service, credit/financial assistance, assortment convenience, breaking bulk, and advice/technical support."], ["Retailers and retail trends", "Retailers primarily sell merchandise for personal or household consumption and provide related services. The slides discuss economic concentration: large firms account for a growing share of retail sales."], ["Facilitating agencies", "Examples include transportation, storage, order processing, advertising, financial and insurance agencies, marketing research firms, and third-party logistics providers (3PLs)."]], "cards": [["How do the slides classify channel participants?", "By whether they perform negotiatory functions: member participants versus nonmember participants."], ["Why might manufacturers use intermediaries?", "They may lack distribution expertise and distribution economies of scale; intermediaries spread fixed costs and handle diverse products."], ["What does a merchant wholesaler do?", "Buys, takes title, usually stores/handles large quantities, and resells in smaller quantities."], ["Do agents and brokers take title to goods?", "No. They negotiate buying and selling on behalf of clients and are usually paid commissions."], ["What distinguishes a commission merchant from many other agents?", "A commission merchant typically takes physical possession of goods but does not take title."], ["What are manufacturers' sales branches and offices?", "Manufacturer-owned and operated facilities separate from manufacturing plants that distribute the manufacturer's products at wholesale."], ["Name six wholesaler tasks performed for manufacturers.", "Market coverage, sales contacts, inventory holding, order processing, market information and customer support."], ["What does breaking bulk mean?", "Buying large quantities and splitting them into smaller quantities for customers."], ["Name six wholesaler tasks performed for customers.", "Product availability, customer service, credit/financial assistance, assortment convenience, breaking bulk, and advice/technical support."], ["What is economic concentration in retailing?", "A situation in which a few large firms dominate a large share of sales or activity in a market."], ["What are facilitating agencies?", "Organizations that support channel members with non-negotiatory services such as transport, storage, advertising, finance, insurance or research."], ["What is a 3PL?", "A third-party logistics provider that performs logistics services for another company, such as transport, storage or order processing."]], "questions": [{"q": "According to the slides, which activity makes a firm a marketing-channel member?", "opts": ["Providing insurance only", "Performing negotiatory functions", "Providing transport only", "Running advertising research only"], "a": 1, "why": "Channel members perform negotiatory functions such as buying, selling and transferring title."}, {"q": "A merchant wholesaler typically:", "opts": ["Never takes title", "Only provides advertising", "Buys, takes title and resells products", "Sells only to final consumers"], "a": 2, "why": "Merchant wholesalers buy, take title and resell products, often in smaller quantities."}, {"q": "Agents and brokers are usually compensated through:", "opts": ["Commissions", "Retail sales tax", "Inventory write-offs", "Warehouse rent"], "a": 0, "why": "The slides say these intermediaries usually receive commissions on sales or purchases."}, {"q": "Which statement about a commission merchant is correct?", "opts": ["Always takes title", "Typically takes possession but not title", "Never handles products physically", "Is always a retailer"], "a": 1, "why": "Commission merchants may receive and warehouse products without taking title."}, {"q": "Which is a reason manufacturers shift distribution tasks to intermediaries?", "opts": ["Intermediaries remove all market demand", "Manufacturers always have better distribution economies", "Intermediaries may achieve economies of scale and scope", "Intermediaries eliminate the need for retailers"], "a": 2, "why": "Intermediaries spread fixed costs and handle many products/customers efficiently."}, {"q": "Which is a distribution task wholesalers perform for manufacturers?", "opts": ["Setting national law", "Market coverage", "Manufacturing all products", "Replacing consumer demand"], "a": 1, "why": "Market coverage is one of the listed tasks."}, {"q": "Breaking bulk means:", "opts": ["Combining small shipments into a factory", "Splitting large quantities into smaller quantities", "Destroying excess inventory", "Transferring title to a carrier"], "a": 1, "why": "Wholesalers buy in bulk and sell smaller quantities to customers."}, {"q": "Which is a facilitating agency?", "opts": ["A merchant wholesaler taking title", "A retailer reselling goods", "An insurance company supporting channel members", "A manufacturer buying raw materials"], "a": 2, "why": "Insurance companies are listed as facilitating agencies."}, {"q": "True or false: Retailers primarily sell merchandise for personal or household consumption.", "opts": ["True", "False"], "a": 0, "why": "This is the definition given in the slides."}, {"q": "True or false: Manufacturers' sales branches are owned and operated by independent retailers.", "opts": ["True", "False"], "a": 1, "why": "They are owned and operated by manufacturers and separated from manufacturing plants."}]}, {"id": 3, "title": "The Environment of Marketing Channels", "subtitle": "Economic, competitive, sociocultural, technological and legal forces", "objectives": ["Explain why the external environment matters to channel management.", "Identify five external environmental factors.", "Explain recession, inflation and deflation as channel influences.", "Distinguish four types of competition.", "Describe sociocultural and technological developments affecting channels.", "Recognize legal issues discussed in the slides."], "summary": [["External environment", "The slides describe the environment as external, uncontrollable factors affecting all channel participants, including members, nonmembers, intermediaries and target markets."], ["Five environmental factors", "Economic, competitive, sociocultural, technological and legal environments."], ["Economic environment", "The slides cover recession, inflation and deflation. A recession can reduce spending and sales; manufacturers may support channel members with high inventory costs. Inflation can shift buyers toward lower-priced products and prompt streamlined product lines and promotional support. Deflation puts pressure on revenues and may encourage cost reduction, material substitutions and sourcing changes."], ["Four types of competition", "Horizontal: same type of firm at the same channel level. Intertype: different types of firms at the same level selling the same product. Vertical: channel members at different levels. Channel-system competition: complete organized channels compete with other complete channels."], ["Sociocultural environment", "Cultural preferences, age patterns, changing ethnic mix, education, family/household structure and shopping preferences can influence channel structures and customer expectations."], ["Technological environment", "The slides discuss computerized inventory and replenishment systems, the Internet and smartphones, RFID, and cloud computing. These tools can support inventory visibility, online shopping and coordination across channels."], ["Legal environment", "The legal environment consists of laws that affect marketing channels. The slides include exclusive dealing, full-line forcing, price discrimination and vertical integration as legal issues for channel managers to understand."], ["Vertical marketing systems", "The slides identify corporate, contractual and administered systems as forms of organized channel systems: common ownership, contractual links among independent members, or dominance by one channel member."]], "cards": [["Name the five external environmental factors.", "Economic, competitive, sociocultural, technological and legal."], ["How do the slides define the external environment?", "External, uncontrollable factors within which marketing channels exist and that affect all channel participants."], ["What is a recession in the slides?", "A slowdown described as two consecutive quarters of decline in GDP."], ["What is inflation?", "The rate of increase in prices for goods and services."], ["What is deflation?", "A general decline in prices, or negative inflation."], ["What is horizontal competition?", "Competition between firms of the same type at the same channel level."], ["What is intertype competition?", "Competition between different types of firms at the same channel level selling the same product."], ["What is vertical competition?", "Competition between channel members at different levels of the channel."], ["What is channel-system competition?", "Competition between complete, organized channel systems."], ["Name the three vertical marketing system types in the slides.", "Corporate, contractual and administered."], ["Give examples of technology topics from Chapter 3.", "Computerized systems, Internet/smartphones, RFID and cloud computing."], ["What is exclusive dealing?", "A supplier requires channel members to sell only its products or avoid products from directly competitive suppliers."], ["What is full-line forcing?", "A supplier requires channel members to carry the supplier's full product line."], ["What is vertical integration?", "A firm owns and operates organizations at other levels of the distribution channel."]], "questions": [{"q": "Which list contains all five environmental factors identified in the slides?", "opts": ["Economic, competitive, sociocultural, technological, legal", "Product, price, place, promotion, people", "Local, national, global, digital, retail", "Supplier, buyer, carrier, agent, broker"], "a": 0, "why": "Chapter 3 names the five external environments as economic, competitive, sociocultural, technological and legal."}, {"q": "The slides describe a recession as:", "opts": ["A rise in prices only", "Two consecutive quarters of GDP decline", "A decline in all retail prices", "An increase in exports"], "a": 1, "why": "That is the definition presented in the slides."}, {"q": "Competition between two supermarkets is an example of:", "opts": ["Vertical competition", "Channel-system competition", "Horizontal competition", "Intertype competition"], "a": 2, "why": "Supermarkets are the same type of firm at the same channel level."}, {"q": "A gas station and a specialist tire shop selling tires compete through:", "opts": ["Horizontal competition", "Intertype competition", "Vertical competition", "No competition"], "a": 1, "why": "They are different types of firms at the same channel level selling the same product."}, {"q": "Competition between a manufacturer and a retailer is:", "opts": ["Horizontal", "Intertype", "Vertical", "Only legal"], "a": 2, "why": "They operate at different channel levels."}, {"q": "What is channel-system competition?", "opts": ["One retailer competing with another retailer only", "Complete organized channels competing against complete channels", "Competition between a carrier and a warehouse", "Competition between two products in one store"], "a": 1, "why": "The slides define it as complete channels competing with other complete channels."}, {"q": "Which is NOT one of the three vertical marketing system types listed?", "opts": ["Corporate", "Contractual", "Administered", "Horizontal"], "a": 3, "why": "The three types are corporate, contractual and administered."}, {"q": "Which technology is explicitly mentioned in Chapter 3?", "opts": ["RFID", "Steam engines", "Typewriters only", "Fax-only retailing"], "a": 0, "why": "RFID and supply-chain management are explicitly covered."}, {"q": "Exclusive dealing involves a supplier requiring channel members to:", "opts": ["Carry every competing product", "Sell only its products or avoid directly competitive suppliers", "Transfer ownership to customers before sale", "Use only one transport company in every case"], "a": 1, "why": "This matches the slide definition of exclusive dealing."}, {"q": "True or false: The legal environment can affect marketing channels.", "opts": ["True", "False"], "a": 0, "why": "The slides describe laws affecting marketing channels and legal knowledge as important for channel managers."}]}]};

function home(){let answered=Object.keys(state.answered).length;let seen=state.cardsSeen.length;return `<div class="top"><div><div class="eyebrow">MARKETING CHANNELS · STUDY SPACE</div><h1>MKT 402 Study Hub</h1><p>Rosenbloom · Chapters 1, 2 and 3</p></div><span class="tag">POWERPOINT-BASED CONTENT</span></div>
<section class="hero"><h2>Study smarter. Practice with purpose.</h2><p>Review marketing channel concepts, channel participants, and the marketing-channel environment with chapter notes, bilingual summaries, questions and flashcards.</p><button class="button light" onclick="go('ch1')">Start studying →</button></section>
<div class="stats">${stat('Chapters visited',state.visited.length+'/3')}${stat('Questions answered',answered)}${stat('Flashcards reviewed',seen)}${stat('Question bank',allQuestions().length+' questions')}</div>
<div class="sectionhead"><div><h2>Your chapters</h2><p>Notes and practice based on the uploaded lecture slides.</p></div></div>
<div class="chapters">${DATA.chapters.map(c=>`<article class="chapter"><div class="num">0${c.id}</div><h3>${c.title}</h3><p>${c.subtitle}</p><span class="pill">${c.questions.length} questions · ${c.cards.length} cards</span><button onclick="go('ch${c.id}')">Open chapter →</button></article>`).join('')}</div>
<div class="sectionhead"><div><h2>Practice tools</h2><p>Check your understanding and revisit difficult concepts.</p></div></div><div class="tools">${tool('☷','Quiz Bank','Practice MCQs and true/false questions with explanations.','quiz')}${tool('▣','Flashcards','Review key terms and definitions.','cards')}${tool('◷','Mock Exam','Take a mixed quiz and review your score.','exam')}${tool('↗','My Progress','Track activity saved in this browser.','progress')}</div>
<div class="footer">Study aid based on the uploaded Rosenbloom PowerPoint slides. Some slide statements and examples reflect the source material; use your instructor’s slides as the final authority.</div>`}
function chapterPage(id){let c=chapter(id);return `<div class="top"><div><div class="eyebrow">MKT 402 · CHAPTER ${id}</div><h1>${c.title}</h1><p>${c.subtitle}</p></div><span class="pill">${c.questions.length} practice questions</span></div>
<section class="panel"><h2>Learning objectives</h2><ol class="obj">${c.objectives.map(x=>`<li>${x}</li>`).join('')}</ol></section>
<div class="sectionhead"><div><h2>Chapter notes</h2><p>English explanation with a concise Arabic recap.</p></div></div>
<div class="content-grid">${c.summary.map(s=>`<article class="note"><h3>${s[0]}</h3><p>${s[1]}</p><div class="arabic">${arabicRecap(s[0],s[1])}</div></article>`).join('')}</div>
<div class="toolbar"><button class="button" onclick="go('quiz');state.filter='${id}';render()">Practice Chapter ${id}</button><button class="button outline" onclick="go('cards');state.cardIndex=allCards().findIndex(x=>x.chapter===${id});render()">Review Chapter ${id} flashcards</button></div>`}
function arabicRecap(title,txt){const map={
'Why channels matter':'أهمية قنوات التسويق: التقنية والتجارة الإلكترونية، صعوبة تقليد الميزة التنافسية، قوة الوسطاء وتجار التجزئة، وخفض تكاليف التوزيع.',
'Disintermediation and reintermediation':'إزالة الوساطة تعني تقليل الوسطاء، وإعادة الوساطة تعني ظهور وسطاء جدد أو طرق جديدة لربط البائعين بالمشترين.',
'Marketing channel definition':'قناة التسويق هي تنظيم خارجي من العلاقات التعاقدية تديره الإدارة لتحقيق أهداف التوزيع.',
'Channel strategy and the marketing mix':'استراتيجية القنوات تدعم المنتج والسعر والترويج، وقد تحقق ميزة يصعب على المنافسين تقليدها.',
'Six marketing channel flows':'تدفقات القناة تشمل حركة المنتج، والتفاوض، والملكية، والمعلومات، والترويج.',
'Channel strategy vs. logistics':'استراتيجية القناة أوسع من اللوجستيات؛ اللوجستيات تركز على تدفق المنتج وتوفّره في الوقت والمكان المناسبين.',
'Channel structure vs. ancillary structure':'هيكل القناة يحدد أعضاء القناة الموزعة عليهم المهام، أما الهيكل المساند فيشمل الجهات التي تقدم خدمات مساعدة.',
'Intermediaries and contactual efficiency':'كفاءة الاتصال التفاوضي تقارن جهد التفاوض بالنتائج المحققة لأهداف التوزيع.',
'Channel participant classification':'يُصنّف المشاركون حسب أداء الوظائف التفاوضية؛ الأعضاء يتفاوضون على الشراء والبيع ونقل الملكية.',
'Why use intermediaries?':'يستعين المنتجون بالوسطاء عند نقص خبرة التوزيع أو وفورات الحجم؛ فالوسطاء يوزعون التكاليف على منتجات وكميات متنوعة.',
'Merchant wholesalers':'تجار الجملة يشترون المنتجات ويمتلكونها غالبًا ويخزنونها ثم يبيعونها بكميات أصغر.',
'Agents, brokers and commission merchants':'الوكلاء والسماسرة يتفاوضون نيابة عن العملاء ولا يمتلكون البضاعة؛ تاجر العمولة قد يحوزها فعليًا دون امتلاكها.',
'Manufacturers’ sales branches and offices':'فروع ومكاتب البيع بالجملة مملوكة للمنتج وتعمل بعيدًا عن مصنع الإنتاج.',
'Wholesaler tasks for manufacturers':'خدمات تجار الجملة للمنتجين: تغطية السوق، التواصل البيعي، المخزون، معالجة الطلبات، المعلومات ودعم العملاء.',
'Wholesaler tasks for customers':'خدماتهم للعملاء: توفر المنتج، الخدمة، الائتمان، تنوع التشكيلة، تجزئة الكميات، والنصيحة الفنية.',
'Retailers and retail trends':'يبيع تجار التجزئة للمستهلك النهائي، وتناقش الشرائح تزايد تركّز المبيعات لدى الشركات الكبيرة.',
'Facilitating agencies':'الجهات المساندة تشمل النقل والتخزين والإعلان والتمويل والتأمين وأبحاث التسويق والخدمات اللوجستية.',
'External environment':'البيئة الخارجية عوامل غير خاضعة للتحكم تؤثر على المشاركين في قنوات التسويق.',
'Five environmental factors':'العوامل الخمسة: الاقتصادية، التنافسية، الاجتماعية والثقافية، التقنية، والقانونية.',
'Economic environment':'الركود يخفض الإنفاق، والتضخم يرفع الأسعار، والانكماش يعني انخفاض المستوى العام للأسعار؛ لكل منها آثار على القناة.',
'Four types of competition':'المنافسة الأفقية بين النوع نفسه، وبين الأنواع في المستوى نفسه، والرأسية بين مستويات مختلفة، ومنافسة أنظمة القنوات بين قنوات كاملة.',
'Sociocultural environment':'الثقافة والعمر والتعليم وتركيبة السكان وتفضيلات التسوق تؤثر على شكل القنوات وتوقعات العملاء.',
'Technological environment':'تشمل التقنية أنظمة المخزون المحوسبة، والإنترنت والهواتف، وRFID والحوسبة السحابية.',
'Legal environment':'تشمل القضايا القانونية التعامل الحصري، وإلزام التشكيلة الكاملة، والتمييز السعري، والتكامل الرأسي.',
'Vertical marketing systems':'أنظمة التسويق الرأسية ثلاثة: مؤسسية (ملكية واحدة)، وتعاقدية، ومدارة بقوة عضو مسيطر.'
};return map[title]||'راجع هذا المفهوم مع شرح الشريحة الإنجليزية، ثم اختبر فهمك من أسئلة الفصل.'}
function questionCard(q,index,mode='quiz'){let selected=mode==='exam'?state.examAnswers[q.key]:state.answered[q.key];let show=selected!==undefined;return `<article class="question"><div class="qhead"><h3>${index+1}. ${q.q}</h3><span class="pill">CH ${q.chapter}</span></div><div class="options">${q.opts.map((o,i)=>`<button class="opt ${show&&i===q.a?'correct':''} ${show&&selected===i&&i!==q.a?'wrong':''}" ${show?'disabled':''} onclick="answer('${q.key}',${i},'${mode}')">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${show?`<div class="feedback"><strong>${selected===q.a?'Correct ✓':'Not quite.'}</strong> ${q.why}</div>`:''}</article>`}
function answer(key,val,mode){if(mode==='exam'){state.examAnswers[key]=val;render()}else{state.answered[key]=val;save();render()}}
function quiz(){let qs=allQuestions();if(state.filter!=='all')qs=qs.filter(q=>q.chapter===Number(state.filter));return `<div class="top"><div><div class="eyebrow">PRACTICE</div><h1>Quiz Bank</h1><p>Multiple choice and true/false, with immediate feedback.</p></div></div><div class="toolbar"><button class="button ${state.filter==='all'?'':'outline'}" onclick="state.filter='all';render()">All chapters</button>${[1,2,3].map(n=>`<button class="button ${state.filter===String(n)?'':'outline'}" onclick="state.filter='${n}';render()">Chapter ${n}</button>`).join('')}<button class="button outline" onclick="if(confirm('Clear saved answers?')){state.answered={};save();render()}">Reset answers</button></div><p class="muted">${Object.keys(state.answered).length} answered out of ${allQuestions().length} total questions.</p>${qs.map((q,i)=>questionCard(q,i)).join('')}`}
function cards(){let cs=allCards();if(!cs.length)return '';state.cardIndex=((state.cardIndex%cs.length)+cs.length)%cs.length;let c=cs[state.cardIndex];return `<div class="top"><div><div class="eyebrow">ACTIVE RECALL</div><h1>Flashcards</h1><p>${state.cardIndex+1} of ${cs.length} · Chapter ${c.chapter}</p></div><span class="pill">${state.cardsSeen.length} reviewed</span></div><div class="flash" onclick="flipCard()"><div class="label">${state.cardFlipped?'Answer':'Question'} · tap to flip</div><h2>${state.cardFlipped?c.back:c.front}</h2><div class="hint">${state.cardFlipped?'Think about whether you can explain this without looking.':'Try to answer before revealing the definition.'}</div></div><div class="toolbar" style="justify-content:center"><button class="button outline" onclick="prevCard()">← Previous</button><button class="button" onclick="markCard()">Mark reviewed ✓</button><button class="button outline" onclick="nextCard()">Next →</button></div><div class="toolbar" style="justify-content:center">${[1,2,3].map(n=>`<button class="button outline" onclick="state.cardIndex=allCards().findIndex(x=>x.chapter===${n});state.cardFlipped=false;render()">Chapter ${n}</button>`).join('')}<button class="button outline" onclick="state.cardIndex=0;state.cardFlipped=false;render()">All cards</button></div>`}
function flipCard(){state.cardFlipped=!state.cardFlipped;render()}function nextCard(){state.cardIndex++;state.cardFlipped=false;render()}function prevCard(){state.cardIndex--;state.cardFlipped=false;render()}function markCard(){let c=allCards()[state.cardIndex];if(!state.cardsSeen.includes(c.key))state.cardsSeen.push(c.key);save();nextCard()}
function exam(){let qs=allQuestions();if(!state.examStarted)return `<div class="top"><div><div class="eyebrow">EXAM PRACTICE</div><h1>Mock Exam</h1><p>A mixed set from Chapters 1–3.</p></div></div><section class="panel"><h2>Ready to test yourself?</h2><p class="muted">This practice exam uses all ${qs.length} questions from the current bank. Select one answer per question; submit to see your score and explanations.</p><ul><li>Questions from Chapters 1, 2 and 3</li><li>Instant score after submission</li><li>Review correct answers and explanations</li></ul><button class="button" onclick="state.examStarted=true;state.examAnswers={};state.examDone=false;render()">Start mock exam →</button></section>`;let score=qs.filter(q=>state.examAnswers[q.key]===q.a).length;return `<div class="top"><div><div class="eyebrow">EXAM PRACTICE</div><h1>Mock Exam</h1><p>${Object.keys(state.examAnswers).length}/${qs.length} answered</p></div></div>${state.examDone?`<div class="result"><h2>Result: ${score} / ${qs.length} (${Math.round(score/qs.length*100)}%)</h2><p>Review the questions below to understand any mistakes.</p><button class="button" onclick="state.examStarted=false;state.examDone=false;render()">Back to exam start</button></div>`:`<div class="progressbar"><span style="width:${Object.keys(state.examAnswers).length/qs.length*100}%"></span></div>`}${qs.map((q,i)=>questionCard(q,i,'exam')).join('')}${state.examDone?'':`<button class="button" onclick="state.examDone=true;render()">Submit exam</button>`}`}
function progress(){let answered=Object.keys(state.answered).length,correct=Object.entries(state.answered).filter(([key,val])=>{let q=allQuestions().find(x=>x.key===key);return q&&q.a===val}).length;return `<div class="top"><div><div class="eyebrow">YOUR LEARNING</div><h1>My Progress</h1><p>Saved on this device in this browser.</p></div></div><section class="panel"><h2>Chapter activity</h2><p class="muted">${state.visited.length} of 3 chapters opened.</p><div class="progressbar"><span style="width:${state.visited.length/3*100}%"></span></div>${DATA.chapters.map(c=>`<p>${state.visited.includes(c.id)?'✓':'○'} &nbsp; Chapter ${c.id}: ${c.title} ${state.visited.includes(c.id)?'· Opened':'· Not opened yet'}</p>`).join('')}<hr class="divider"><div class="stats">${stat('Answered',answered+'/'+allQuestions().length)}${stat('Correct',correct)}${stat('Flashcards reviewed',state.cardsSeen.length+'/'+allCards().length)}${stat('Accuracy',answered?Math.round(correct/answered*100)+'%':'—')}</div><button class="button outline" onclick="if(confirm('Reset all saved progress on this device?')){state.visited=[];state.answered={};state.cardsSeen=[];save();render()}">Reset progress</button></section>`}
function render(){let p=state.page;let html=p==='home'?home():p.startsWith('ch')?chapterPage(Number(p.slice(2))):p==='quiz'?quiz():p==='cards'?cards():p==='exam'?exam():progress();document.getElementById('main').innerHTML=html;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{state.filter='all';go(b.dataset.page)}));render();
</script></body></html>
